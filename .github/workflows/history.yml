name: AMC drop history

# Convenience viewer. You can also just open HISTORY.md in the repo directly —
# it's the same content, committed after every run.
on:
  workflow_dispatch: {}

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show drop history
        run: |
          echo "::group::HISTORY.md"
          cat HISTORY.md 2>/dev/null || echo "No history yet."
          echo "::endgroup::"

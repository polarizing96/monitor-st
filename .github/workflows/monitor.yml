name: AMC showtimes monitor

on:
  schedule:
    # Every 2 hours. Chosen to stay under the 2,000 min/mo Free quota on a
    # PRIVATE repo (~360 runs × ~4 min ≈ 1,440 min). Make the repo public for
    # unlimited minutes if you want tighter polling (e.g. '*/15 * * * *').
    # GitHub delays scheduled runs under load — best-effort, not to-the-minute.
    - cron: '0 */2 * * *'
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

concurrency:
  # Never let two runs overlap (they'd double-text and race the state files).
  group: amc-monitor
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated state files back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    # Official Playwright image: Node 20 + Chromium + all OS libs PREBAKED.
    # No browser download, no apt install at runtime — the two slow/flaky steps
    # are gone. Tag MUST match the `playwright` version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Only 2 tiny deps (dotenv + playwright JS); browser already in the image.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run monitor (once)
        run: node index.js --once
        env:
          AMC_THEATRE_URL: ${{ vars.AMC_THEATRE_URL }}
          AMC_MAX_DATES: ${{ vars.AMC_MAX_DATES }}
          # Rotating sticky-session residential proxy (see README).
          AMC_PROXIES: ${{ secrets.AMC_PROXIES }}
          # Push notifications via ntfy.sh (free, no signup).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated state
        if: always() # persist state even if the monitor step errored partway
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain seen.json drops.json HISTORY.md)" ]; then
            git add seen.json drops.json HISTORY.md
            git commit -m "state: update seen showtimes [skip ci]"
            # Rebase in case a manual run advanced the branch, then push.
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "no state changes"
          fi

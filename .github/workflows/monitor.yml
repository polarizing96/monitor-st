name: AMC showtimes monitor

on:
  schedule:
    # Every 2 hours. Chosen to stay under the 2,000 min/mo Free quota on a
    # PRIVATE repo (~360 runs × ~4 min ≈ 1,440 min). Make the repo public for
    # unlimited minutes if you want tighter polling (e.g. '*/15 * * * *').
    # GitHub delays scheduled runs under load — best-effort, not to-the-minute.
    - cron: '0 */2 * * *'
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

concurrency:
  # Never let two runs overlap (they'd double-text and race the DB).
  group: amc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cache the Playwright browser download between runs (fast + polite).
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - run: npx playwright install --with-deps chromium

      - name: Run monitor (once)
        run: node index.js --once
        env:
          AMC_THEATRE_URL: ${{ vars.AMC_THEATRE_URL }}
          AMC_MAX_DATES: ${{ vars.AMC_MAX_DATES }}
          # Rotating sticky-session residential proxy (see README).
          AMC_PROXIES: ${{ secrets.AMC_PROXIES }}
          # Serverless SQLite state (Turso).
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # SMS (Twilio).
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
